[package]
name = "commandblock"
version = "1.0.10"
edition = "2021"
description = "Commandblock — ผู้ช่วยพัฒนาโค้ด AI แบบตัวแทน (agentic coding assistant CLI)"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.56"
winit = "0.30"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rpassword = "7"
keyring = "3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
scrap = "0.5"
webrtc = "0.20.0-alpha.1"
enigo = { version = "0.6", default-features = false, features = ["platform_specific"] }
time = { version = "0.3", features = ["formatting", "parsing"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
