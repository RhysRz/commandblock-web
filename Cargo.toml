[package]
name = "commandblock"
version = "1.0.0"
edition = "2021"
description = "Commandblock — ผู้ช่วยพัฒนาโค้ด AI แบบตัวแทน (agentic coding assistant CLI)"
license = "MIT"

[dependencies]
ureq = { version = "2", features = ["json", "tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wry = "0.56"
winit = "0.30"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }
rpassword = "7"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
