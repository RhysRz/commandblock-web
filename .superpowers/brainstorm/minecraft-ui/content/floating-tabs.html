<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0a0911;color:#f3efff;font-family:Inter,system-ui,"Noto Sans Thai",sans-serif;overflow:hidden}.a{position:fixed;inset:-30%;background:radial-gradient(circle at 25% 30%,#5b32bd88,transparent 22%),radial-gradient(circle at 76% 72%,#2d64e866,transparent 28%);filter:blur(42px);animation:d 18s ease-in-out infinite alternate}.frame{position:relative;width:min(760px,92vw);padding:27px;border:1px solid #ffffff24;border-radius:22px;background:#1915258c;backdrop-filter:blur(25px);box-shadow:0 25px 80px #0009,inset 0 1px #ffffff22}.title{font-size:13px;color:#bdb7d1;margin:0 0 14px 3px}.tray{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:6px;border:1px solid #ffffff1a;border-radius:14px;background:#09091294;box-shadow:inset 0 1px #0008}.tab{flex:0 0 auto;border:1px solid transparent;border-radius:10px;background:transparent;color:#aca8bc;padding:9px 13px;font-size:12px;transition:.15s}.tab:hover{background:#ffffff0d;color:#f4f1ff}.tab.active{color:white;border-color:#d8c2ff4d;background:linear-gradient(135deg,#7141d4d9,#ae6df0cc);box-shadow:0 7px 17px #713bdd70,inset 0 1px #ffffff44}.dot{width:6px;height:6px;border-radius:50%;background:#92e9b5;box-shadow:0 0 9px #92e9b5;margin-right:3px}.desc{margin:22px 3px 0;color:#aaa6bd;font-size:12px;line-height:1.6}@keyframes d{to{transform:translate3d(7%,-4%,0) rotate(6deg)}}@media(prefers-reduced-motion:reduce){.a{animation:none}}
</style></head><body><div class="a"></div><main class="frame"><p class="title">RIGHT PANEL · FLOATING TAB TRAY</p><nav class="tray"><span class="tab">Queue</span><span class="tab">Files</span><span class="tab">Changes</span><span class="tab">Preview</span><span class="tab active"><i class="dot"></i> Terminal</span><span class="tab">Notes</span></nav><p class="desc">แถบแก้วลอยอยู่บนพื้น Obsidian · active เป็นม่วงเรืองแสง · hover เบา ๆ · เมื่อพื้นที่ไม่พอ เลื่อนแนวนอนได้เหมือนเดิม</p></main></body></html>
